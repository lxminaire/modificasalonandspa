name: Apply promotion URL update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace promotion URLs and clean placeholders
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path("server.js")
          text = server.read_text()

          old = '''const PROMO_IMAGES = [
              "https://user19535.na.imgto.link/public/20260731/deals1.avif",
              "https://user19535.na.imgto.link/public/20260731/deals2.avif",
              "https://user19535.na.imgto.link/public/20260731/deals3.avif",
              "https://user19535.na.imgto.link/public/20260731/deals4.avif"
          ];'''

          new = '''const PROMO_IMAGES = [
              "https://user39287.na.imgto.link/public/20261001/earlyber1-1.avif",
              "https://user39287.na.imgto.link/public/20261001/earlyber2-1.avif",
              "https://user39287.na.imgto.link/public/20261001/earlyber3-1.avif",
              "https://user39287.na.imgto.link/public/20261001/earlyber4-1.avif",
              "https://user39287.na.imgto.link/public/20261001/earlyber5.avif",
              "https://user39287.na.imgto.link/public/20261001/earlyber6.avif"
          ];'''

          if old not in text:
              raise SystemExit("Expected PROMO_IMAGES block was not found; refusing to modify server.js")

          server.write_text(text.replace(old, new))

          for placeholder in [
              Path("assets/promotions/.gitkeep"),
              Path("assets/promotions/promo-hair-treatment.b64"),
          ]:
              if placeholder.exists():
                  placeholder.unlink()

          workflow = Path(".github/workflows/apply-promo-update.yml")
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Verify Node syntax
        run: node --check server.js

      - name: Commit final update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update promotion image URLs"
          git push origin HEAD:main
